server {
    listen 8080;
    root /usr/share/nginx/html;

    # The same /api path the Vite dev server forwards, so the browser only ever talks to this
    # origin. The trailing slash on proxy_pass strips /api before the request reaches the API.
    location /api/ {
        proxy_pass http://api:8080/;
        # nginx rejects bodies over 1 MB by default, before the API sees them. This lets the
        # API's own 5 MB receipt limit be the one that applies.
        client_max_body_size 6m;
    }
}
