# Local development only. Azure uses Postgres Flexible Server with managed identity.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: expenseclaims
      POSTGRES_USER: expenseclaims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only: Docker-published ports skip the host firewall.
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expenseclaims -d expenseclaims']
      interval: 5s
      retries: 10
  blobs:
    # Azure Blob Storage emulator. The Blob SDK uses a newer storage API version than
    # Azurite knows about yet, hence --skipApiVersionCheck.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - '127.0.0.1:10000:10000'
    volumes:
      - blob-data:/data
volumes:
  db-data:
  blob-data:
