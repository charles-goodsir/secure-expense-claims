# Local development only. Azure uses Postgres Flexible Server with managed identity.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: expenseclaims
      POSTGRES_USER: expenseclaims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only: Docker-published ports skip the host firewall.
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expenseclaims -d expenseclaims']
      interval: 5s
      retries: 10
  blobs:
    # Azure Blob Storage emulator. The Blob SDK uses a newer storage API version than
    # Azurite knows about yet, hence --skipApiVersionCheck.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - '127.0.0.1:10000:10000'
    volumes:
      - blob-data:/data
  api:
    build:
      context: .
      dockerfile: src/ExpenseClaims.Api/Dockerfile
    environment:
      # Development turns on the dev sign-in headers, migrations and the seed users. The same
      # image runs in Azure without it, where the dev sign-in is never registered (threat S2).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Claims: Host=db;Database=expenseclaims;Username=expenseclaims;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Azurite's development account, reached by service name instead of localhost.
      ConnectionStrings__Receipts: UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://blobs
    # No published port: only the web container can reach the API.
    depends_on:
      db:
        condition: service_healthy
      blobs:
        condition: service_started
  web:
    build: web
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      - api
volumes:
  db-data:
  blob-data:
