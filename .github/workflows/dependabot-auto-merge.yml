# Turns on auto-merge for Dependabot's minor and patch PRs. GitHub then merges
# them only once the ruleset's required checks pass. Major updates are left
# for a human. Uses pull_request, not pull_request_target, so the PR's code
# never runs with write access.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    # The PR author, not github.actor: a re-run by someone else shouldn't count.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # For a grouped PR, update-type is the biggest change in the group, so
      # one major update anywhere keeps the whole PR manual. Anything that
      # isn't explicitly minor or patch (including an empty value) stays manual.
      - if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
