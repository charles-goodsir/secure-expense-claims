# Applies infra/ to Azure. Runs when infra/ changes on main, or by hand to rebuild the
# environment at the start of a session and destroy it at the end. Every apply or destroy
# waits for approval in the azure environment.
name: Infra

on:
  push:
    branches: [main]
    paths: ['infra/**']
  workflow_dispatch:
    inputs:
      action:
        description: Build or tear down the environment
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  contents: read

# One run at a time, and never cancel one: a half-finished apply leaves a locked state.
concurrency:
  group: infra
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  DESTROY: ${{ github.event.inputs.action == 'destroy' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # The read-only identity. Nothing changes until the apply job, after approval.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-terraform
      - run: terraform init -lockfile=readonly -input=false
      - name: Plan
        run: |
          set -euo pipefail
          if [ "$DESTROY" = "true" ]; then MODE=-destroy; else MODE=; fi
          terraform plan $MODE -lock=false -input=false -out=tfplan
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
      # The repo is public, so anyone signed in to GitHub can download run artifacts. The plan
      # holds resource IDs and settings but no secrets: nothing in this design has a password.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 1

  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    # Waits here for my approval. Only main can use this environment, and only jobs in it can
    # sign in as the deploy identity.
    environment: azure
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-terraform
      - run: terraform init -lockfile=readonly -input=false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: infra
      # Applies exactly the plan that was reviewed. If state changed since, Terraform refuses.
      - run: terraform apply -input=false tfplan
