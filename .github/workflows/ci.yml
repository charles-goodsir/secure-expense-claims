# Runs on every PR and push to main. Actions are pinned to full commit SHAs;
# Dependabot bumps them through PRs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Locked mode fails if anything resolves differently from packages.lock.json.
      # NuGet audit runs during restore and fails on high or critical advisories.
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet tool restore
      # Fails if someone changed the model without generating a migration.
      - run: dotnet ef migrations has-pending-model-changes --project src/ExpenseClaims.Api --no-build --configuration Release
      - run: dotnet test --no-build --configuration Release

  web:
    name: Web lint, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag is for people reading this; the digest is what runs.
      - run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
          semgrep scan --config p/csharp --config p/typescript --config p/owasp-top-ten
          --error --metrics=off

  images:
    name: Image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy (checksum verified)
        run: |
          set -euo pipefail
          TRIVY_VERSION=0.74.0
          BASE_URL=https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}
          cd "$RUNNER_TEMP"
          curl -sSfLO "${BASE_URL}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "${BASE_URL}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "Linux-64bit.tar.gz$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo mv trivy /usr/local/bin/
      - run: docker build -f src/ExpenseClaims.Api/Dockerfile -t expense-api .
      - run: docker build -t expense-web web
      - run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore.yaml expense-api
      # Scan the second image even if the first failed, so one run shows both.
      - if: ${{ !cancelled() }}
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore.yaml expense-web
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          set -euo pipefail
          VERSION=1.7.12
          BASE_URL=https://github.com/rhysd/actionlint/releases/download/v${VERSION}
          cd "$RUNNER_TEMP"
          curl -sSfLO "${BASE_URL}/actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "${BASE_URL}/actionlint_${VERSION}_checksums.txt"
          grep "linux_amd64.tar.gz$" "actionlint_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${VERSION}_linux_amd64.tar.gz" actionlint
          sudo mv actionlint /usr/local/bin/
      - run: actionlint -color

  infra:
    name: Terraform validate and scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Terraform (checksum verified)
        run: |
          set -euo pipefail
          VERSION=1.16.5
          BASE_URL=https://releases.hashicorp.com/terraform/${VERSION}
          cd "$RUNNER_TEMP"
          curl -sSfLO "${BASE_URL}/terraform_${VERSION}_linux_amd64.zip"
          curl -sSfLO "${BASE_URL}/terraform_${VERSION}_SHA256SUMS"
          grep "linux_amd64.zip$" "terraform_${VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -q "terraform_${VERSION}_linux_amd64.zip" terraform
          sudo mv terraform /usr/local/bin/
      - name: Install Trivy (checksum verified)
        run: |
          set -euo pipefail
          TRIVY_VERSION=0.74.0
          BASE_URL=https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}
          cd "$RUNNER_TEMP"
          curl -sSfLO "${BASE_URL}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "${BASE_URL}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "Linux-64bit.tar.gz$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo mv trivy /usr/local/bin/
      - run: terraform fmt -check -diff -recursive
      # Fails if a provider doesn't match the committed lock file.
      - run: terraform init -backend=false -lockfile=readonly -input=false
      - run: terraform validate
      - run: trivy config --exit-code 1 --severity HIGH,CRITICAL .

  plan:
    name: Terraform plan
    # Pull requests only. Apply on main comes in the next step, with its own identity.
    if: github.event_name == 'pull_request'
    needs: infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job ask GitHub for an OIDC token, which Azure swaps for the plan identity.
      id-token: write
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Terraform (checksum verified)
        run: |
          set -euo pipefail
          VERSION=1.16.5
          BASE_URL=https://releases.hashicorp.com/terraform/${VERSION}
          cd "$RUNNER_TEMP"
          curl -sSfLO "${BASE_URL}/terraform_${VERSION}_linux_amd64.zip"
          curl -sSfLO "${BASE_URL}/terraform_${VERSION}_SHA256SUMS"
          grep "linux_amd64.zip$" "terraform_${VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -q "terraform_${VERSION}_linux_amd64.zip" terraform
          sudo mv terraform /usr/local/bin/
      - run: terraform init -lockfile=readonly -input=false
      # A PR plan only reads state, so it doesn't take the lock. The plan identity then only
      # needs read access to state, and a cancelled run can't leave a stale lock behind.
      - run: terraform plan -lock=false -input=false
